<!DOCTYPE html>
<!--
╔══════════════════════════════════════════════════════════════╗
║  NEIRA YORK COFFEE — index.html                              ║
║  Este archivo es el ESQUELETO. No contiene contenido.        ║
║                                                              ║
║  ESTRUCTURA DE ARCHIVOS:                                     ║
║  ├── index.html            ← Este archivo (no editar)        ║
║  ├── .nojekyll             ← Requerido por GitHub Pages      ║
║  ├── assets/                                                 ║
║  │   ├── css/global.css    ← Variables, tipografías, botones ║
║  │   ├── js/app.js         ← Toda la lógica JS               ║
║  │   └── img/logo.png      ← Logo oficial                    ║
║  └── sections/                                               ║
║      ├── nav.js            ← Barra de navegación             ║
║      ├── hero.js           ← Sección portada                 ║
║      ├── cafes.js          ← Catálogo de cafés (PRINCIPAL)   ║
║      ├── quienes.js        ← Quiénes somos                   ║
║      ├── servicios.js      ← Los 9 servicios                 ║
║      ├── exportacion.js    ← Exportación internacional       ║
║      ├── clientes.js       ← Clientes y aliados              ║
║      └── contacto.js       ← Footer y contacto               ║
║                                                              ║
║  CÓMO EDITAR UNA SECCIÓN:                                    ║
║  → Abre el archivo .js de la sección en sections/            ║
║  → Busca el HTML dentro del template literal (`...`)         ║
║  → Edita y guarda → en GitHub: edita el archivo directamente ║
║                                                              ║
║  CÓMO FUNCIONA EN GITHUB PAGES:                              ║
║  → Cada sections/*.js se carga con <script src="">           ║
║  → No requiere servidor especial, funciona directo           ║
╚══════════════════════════════════════════════════════════════╝
-->
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Neira York Coffee | Café Especial Colombiano</title>
  <meta name="description" content="Café especial colombiano desde el corazón de Caldas. Más de 16 variedades. Despachos nacionales."/>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

  <!-- Estilos globales compartidos por todas las secciones -->
  <link rel="stylesheet" href="assets/css/global.css"/>

  <!-- ↓ Pantalla de carga mientras los scripts se ejecutan ↓ -->
  <style>
    #page-loader{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
    #page-loader.done{opacity:0;pointer-events:none}
    .loader-ring{width:40px;height:40px;border:3px solid #EDE8E0;border-top-color:#C8102E;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<!-- Pantalla de carga -->
<div id="page-loader"><div class="loader-ring"></div></div>

<!-- ─── CONTENEDORES DE SECCIONES ─── -->
<!-- Cada sections/*.js inyecta su HTML aquí -->
<div id="s-nav"></div>
<div id="s-hero"></div>
<div id="s-cafes"></div>
<div id="s-quienes"></div>
<div id="s-servicios"></div>
<div id="s-exportacion"></div>
<div id="s-clientes"></div>
<div id="s-contacto"></div>

<!-- Contenedor de modales (los inyectan las propias secciones) -->
<div id="modals"></div>

<!-- ─── CARGA DE SECCIONES ─── -->
<!-- IMPORTANTE: el orden aquí define el orden en la página -->
<script src="sections/nav.js"></script>
<script src="sections/hero.js"></script>
<script src="sections/cafes.js"></script>
<script src="sections/quienes.js"></script>
<script src="sections/servicios.js"></script>
<script src="sections/exportacion.js"></script>
<script src="sections/clientes.js"></script>
<script src="sections/contacto.js"></script>

<!-- Lógica global (se ejecuta DESPUÉS de que todas las secciones carguen) -->
<script src="assets/js/app.js"></script>

</body>
</html>
